<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>1% DROP</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top,#20294a 0%,#11162b 35%,#080b15 75%);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}

#game{
  width:min(100%,480px);
  margin:auto;
  padding:20px 16px 50px;
}

.title{
  text-align:center;
  font-size:36px;
  font-weight:1000;
  letter-spacing:2px;
  margin-top:5px;
}

.title span{
  color:#ffd84a;
}

.subtitle{
  text-align:center;
  color:#8c97bd;
  font-size:12px;
  margin-bottom:18px;
}

.card{
  border:1px solid #343d65;
  background:rgba(22,28,53,.88);
  border-radius:22px;
  padding:16px;
  box-shadow:0 16px 30px rgba(0,0,0,.28);
}

.topStats{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.stat{
  flex:1;
  background:#10162c;
  border:1px solid #303a61;
  border-radius:15px;
  padding:10px 6px;
  text-align:center;
}

.stat small{
  display:block;
  color:#8f9abe;
  font-size:10px;
}

.stat strong{
  font-size:16px;
}

.enemyArea{
  text-align:center;
}

.stage{
  color:#ffd84a;
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
}

.enemyEmoji{
  font-size:92px;
  margin:8px 0;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.35));
  transition:.15s;
}

.enemyEmoji.hit{
  transform:translateX(-10px) rotate(-6deg) scale(.92);
  filter:brightness(2);
}

.enemyName{
  font-weight:1000;
  font-size:23px;
}

.hpText{
  margin-top:9px;
  font-weight:800;
}

.bar{
  height:15px;
  background:#070a13;
  border-radius:999px;
  overflow:hidden;
  border:1px solid #333b5c;
  margin-top:7px;
}

.enemyHP{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff365f,#ff7848);
  transition:.35s;
}

.playerHP{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#20d990,#59f0b6);
  transition:.35s;
}

.playerPanel{
  margin-top:13px;
  padding:12px;
  background:#0d1328;
  border-radius:15px;
}

.playerRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
}

.weapon{
  color:#ffd84a;
  font-weight:900;
}

.diceBox{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:19px 0 13px;
}

.die{
  width:74px;
  height:74px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:49px;
  background:linear-gradient(145deg,#fff,#d8dcf4);
  color:#161a2a;
  box-shadow:
    0 9px 0 #9ca3c5,
    0 15px 22px rgba(0,0,0,.45);
}

.die.rolling{
  animation:roll .12s linear infinite;
}

@keyframes roll{
  0%{transform:rotate(-8deg) scale(.94);}
  50%{transform:rotate(8deg) scale(1.06);}
  100%{transform:rotate(-8deg) scale(.94);}
}

.attackBtn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px;
  font-size:21px;
  font-weight:1000;
  color:#171100;
  background:linear-gradient(#ffe75b,#ffb91f);
  box-shadow:0 7px 0 #ad7200;
  cursor:pointer;
}

.attackBtn:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #ad7200;
}

.attackBtn:disabled{
  filter:grayscale(.8);
  opacity:.6;
}

.message{
  min-height:58px;
  margin-top:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:11px;
  border-radius:15px;
  background:#0c1122;
  border:1px solid #2c3452;
  color:#dbe1ff;
  font-size:14px;
  line-height:1.5;
}

.crit{
  color:#ffd84a;
  font-size:21px;
  font-weight:1000;
  text-shadow:0 0 16px #ffb400;
}

.inventoryTitle{
  margin:20px 4px 9px;
  font-weight:1000;
}

.inventory{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.item{
  padding:12px;
  border-radius:14px;
  background:#10162b;
  border:1px solid #303957;
  font-size:12px;
}

.item strong{
  display:block;
  margin-top:4px;
  font-size:13px;
}

.NORMAL{border-color:#7e8799;}
.RARE{border-color:#3d9dff;box-shadow:inset 0 0 15px rgba(61,157,255,.12);}
.EPIC{border-color:#b95cff;box-shadow:inset 0 0 15px rgba(185,92,255,.15);}
.LEGEND{border-color:#ffd337;box-shadow:0 0 13px rgba(255,211,55,.23);}
.GOD{
  border-color:#ff63e6;
  animation:godBorder 1s infinite alternate;
}

@keyframes godBorder{
  to{
    box-shadow:
      0 0 12px #54eaff,
      0 0 25px #ff62e8;
  }
}

/* DROP演出 */
#dropOverlay{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(2,4,10,.94);
}

#dropOverlay.show{
  display:flex;
}

.dropCard{
  width:min(92vw,410px);
  text-align:center;
  border-radius:27px;
  padding:28px 18px;
  background:#11172c;
  border:2px solid white;
  transform:scale(.7);
  animation:dropIn .48s cubic-bezier(.2,1.5,.4,1) forwards;
}

@keyframes dropIn{
  to{transform:scale(1);}
}

.dropLabel{
  letter-spacing:4px;
  font-weight:900;
  color:#aab3d2;
}

.dropRarity{
  font-size:38px;
  font-weight:1000;
  margin:8px 0;
}

.dropIcon{
  font-size:80px;
}

.dropName{
  font-size:24px;
  font-weight:1000;
  margin-top:10px;
}

.dropEffect{
  margin-top:9px;
  color:#cbd2ed;
}

.dropChance{
  margin-top:9px;
  font-size:12px;
  opacity:.7;
}

.dropButtons{
  display:flex;
  gap:9px;
  margin-top:20px;
}

.dropButtons button{
  flex:1;
  border:0;
  border-radius:13px;
  padding:14px 5px;
  font-weight:900;
  font-size:14px;
}

.keepBtn{
  background:#303852;
  color:white;
}

.equipBtn{
  background:#ffe04c;
  color:#151000;
}

.flash{
  position:fixed;
  inset:0;
  background:white;
  z-index:100;
  pointer-events:none;
  opacity:0;
}

.flash.go{
  animation:flash .5s;
}

@keyframes flash{
  0%{opacity:0;}
  20%{opacity:1;}
  100%{opacity:0;}
}

.damageText{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:37px;
  font-weight:1000;
  color:#fff;
  text-shadow:0 3px 0 #ad143a;
  animation:damageFly .7s forwards;
  pointer-events:none;
}

@keyframes damageFly{
  from{opacity:1;transform:translate(-50%,0) scale(.7);}
  to{opacity:0;transform:translate(-50%,-80px) scale(1.25);}
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<div id="game">

  <div class="title"><span>1%</span> DROP</div>
  <div class="subtitle">ROLL・DEFEAT・LOOT</div>

  <div class="topStats">
    <div class="stat">
      <small>撃破数</small>
      <strong id="kills">0</strong>
    </div>

    <div class="stat">
      <small>最高レア</small>
      <strong id="best">---</strong>
    </div>

    <div class="stat">
      <small>所持品</small>
      <strong id="itemCount">0</strong>
    </div>
  </div>

  <div class="card">

    <div class="enemyArea">

      <div class="stage" id="stageText">STAGE 1</div>

      <div class="enemyEmoji" id="enemyEmoji">🟢</div>

      <div class="enemyName" id="enemyName">スライム</div>

      <div class="hpText">
        HP <span id="enemyHpText">30 / 30</span>
      </div>

      <div class="bar">
        <div class="enemyHP" id="enemyHpBar"></div>
      </div>

    </div>

    <div class="playerPanel">

      <div class="playerRow">
        <span>あなた ❤️ <b id="playerHpText">60 / 60</b></span>
        <span class="weapon" id="weaponText">素手 +0</span>
      </div>

      <div class="bar">
        <div class="playerHP" id="playerHpBar"></div>
      </div>

    </div>

    <div class="diceBox">
      <div class="die" id="d1">⚀</div>
      <div class="die" id="d2">⚀</div>
      <div class="die" id="d3">⚀</div>
    </div>

    <button class="attackBtn" id="attackBtn" onclick="attack()">
      🎲 ダイスを振る
    </button>

    <div class="message" id="message">
      ダイス3個の合計値で攻撃します。
    </div>

  </div>

  <div class="inventoryTitle">🎒 ドロップ図鑑</div>

  <div class="inventory" id="inventory">
    <div style="grid-column:1/3;text-align:center;color:#717b9e;padding:20px;">
      まだアイテムを持っていません
    </div>
  </div>

</div>


<div id="dropOverlay">

  <div class="dropCard" id="dropCard">

    <div class="dropLabel">ITEM DROP</div>

    <div class="dropRarity" id="dropRarity">NORMAL</div>

    <div class="dropIcon" id="dropIcon">🗡️</div>

    <div class="dropName" id="dropName">木の剣</div>

    <div class="dropEffect" id="dropEffect">
      攻撃力 +1
    </div>

    <div class="dropChance" id="dropChance"></div>

    <div class="dropButtons">
      <button class="keepBtn" onclick="closeDrop(false)">
        保管する
      </button>

      <button class="equipBtn" onclick="closeDrop(true)">
        装備する
      </button>
    </div>

  </div>

</div>


<script>

const diceChars=["⚀","⚁","⚂","⚃","⚄","⚅"];

const enemies=[
  {name:"スライム",emoji:"🟢",hp:30,min:2,max:6},
  {name:"コウモリ",emoji:"🦇",hp:48,min:3,max:8},
  {name:"ゴブリン",emoji:"👺",hp:70,min:4,max:10},
  {name:"ゴブリンキング",emoji:"👑",hp:110,min:6,max:13},
  {name:"炎竜",emoji:"🐉",hp:170,min:8,max:16}
];

const loot={
 NORMAL:[
  {name:"木の剣",icon:"🗡️",atk:1},
  {name:"石のナイフ",icon:"🔪",atk:2},
  {name:"冒険者の剣",icon:"⚔️",atk:3}
 ],

 RARE:[
  {name:"蒼鉄の剣",icon:"🗡️",atk:5},
  {name:"雷の短剣",icon:"⚡",atk:6},
  {name:"騎士の大剣",icon:"⚔️",atk:7}
 ],

 EPIC:[
  {name:"紫電剣",icon:"💜",atk:10},
  {name:"魔導ブレード",icon:"🔮",atk:12},
  {name:"鬼神の刀",icon:"👹",atk:14}
 ],

 LEGEND:[
  {name:"炎龍剣",icon:"🔥",atk:22},
  {name:"王者の聖剣",icon:"👑",atk:25},
  {name:"天雷剣",icon:"⚡",atk:28}
 ],

 GOD:[
  {name:"神滅剣・アポカリプス",icon:"🌈",atk:50},
  {name:"終焉の魔剣",icon:"💀",atk:55},
  {name:"創世神の剣",icon:"✨",atk:60}
 ]
};

let stage=0;
let enemyHp=enemies[0].hp;

let playerMaxHp=60;
let playerHp=playerMaxHp;

let kills=0;

let weapon={
 name:"素手",
 atk:0,
 rarity:"NORMAL"
};

let inventory=[];

let currentDrop=null;
let busy=false;

function rand(min,max){
 return Math.floor(Math.random()*(max-min+1))+min;
}

function vibrate(pattern){
 if(navigator.vibrate){
  navigator.vibrate(pattern);
 }
}

function update(){

 const e=enemies[stage];

 document.getElementById("stageText").textContent=
 "STAGE "+(stage+1);

 document.getElementById("enemyEmoji").textContent=e.emoji;
 document.getElementById("enemyName").textContent=e.name;

 document.getElementById("enemyHpText").textContent=
 Math.max(0,enemyHp)+" / "+e.hp;

 document.getElementById("enemyHpBar").style.width=
 Math.max(0,(enemyHp/e.hp)*100)+"%";

 document.getElementById("playerHpText").textContent=
 playerHp+" / "+playerMaxHp;

 document.getElementById("playerHpBar").style.width=
 (playerHp/playerMaxHp*100)+"%";

 document.getElementById("weaponText").textContent=
 weapon.name+" +"+weapon.atk;

 document.getElementById("kills").textContent=kills;
 document.getElementById("itemCount").textContent=inventory.length;

 renderInventory();
}

function attack(){

 if(busy)return;

 busy=true;

 const btn=document.getElementById("attackBtn");
 btn.disabled=true;

 const dice=[
  document.getElementById("d1"),
  document.getElementById("d2"),
  document.getElementById("d3")
 ];

 dice.forEach(d=>d.classList.add("rolling"));

 document.getElementById("message").innerHTML=
 "🎲 ダイスロール...";

 let ticks=0;

 const anim=setInterval(()=>{

  dice.forEach(d=>{
   d.textContent=diceChars[rand(0,5)];
  });

  ticks++;

  if(ticks>=12){

   clearInterval(anim);

   dice.forEach(d=>d.classList.remove("rolling"));

   const rolls=[rand(1,6),rand(1,6),rand(1,6)];

   dice.forEach((d,i)=>{
    d.textContent=diceChars[rolls[i]-1];
   });

   resolveAttack(rolls);
  }

 },70);
}

function resolveAttack(rolls){

 let damage=rolls.reduce((a,b)=>a+b,0)+weapon.atk;

 const sixCount=rolls.filter(x=>x===6).length;

 let critical=false;

 if(sixCount>=2){
  damage*=2;
  critical=true;
 }

 enemyHp-=damage;

 hitEnemy(damage);

 vibrate(critical ? [40,40,80] : 35);

 if(critical){

  document.getElementById("message").innerHTML=
  '<div class="crit">⚡ CRITICAL!!<br>💥 '+damage+' DAMAGE!!</div>';

 }else{

  document.getElementById("message").innerHTML=
  "⚔️ "+damage+" ダメージ！";
 }

 update();

 setTimeout(()=>{

  if(enemyHp<=0){
   defeatEnemy();
  }else{
   enemyAttack();
  }

 },700);
}

function hitEnemy(damage){

 const enemy=document.getElementById("enemyEmoji");

 enemy.classList.add("hit");

 setTimeout(()=>{
  enemy.classList.remove("hit");
 },180);

 const text=document.createElement("div");

 text.className="damageText";
 text.textContent="-"+damage;
 text.style.top=(enemy.getBoundingClientRect().top+40)+"px";

 document.body.appendChild(text);

 setTimeout(()=>{
  text.remove();
 },700);
}

function enemyAttack(){

 const e=enemies[stage];

 const dmg=rand(e.min,e.max);

 playerHp-=dmg;

 if(playerHp<0)playerHp=0;

 vibrate(60);

 document.getElementById("message").innerHTML=
 "💢 "+e.name+"の反撃！<br>❤️ -"+dmg;

 update();

 if(playerHp<=0){

  setTimeout(()=>{

   document.getElementById("message").innerHTML=
   "💀 敗北…<br>HPを全回復して再挑戦！";

   playerHp=playerMaxHp;
   enemyHp=e.hp;

   update();

   busy=false;
   document.getElementById("attackBtn").disabled=false;

  },1000);

 }else{

  busy=false;
  document.getElementById("attackBtn").disabled=false;
 }
}

function defeatEnemy(){

 kills++;

 document.getElementById("message").innerHTML=
 "💥 撃破！！<br>DROP判定中……";

 vibrate([60,50,100]);

 playerHp=Math.min(playerMaxHp,playerHp+12);

 update();

 setTimeout(()=>{
  rollDrop();
 },1100);
}

function rollDrop(){

 const r=Math.random()*100;

 let rarity;

 if(r<0.1){
  rarity="GOD";
 }else if(r<2){
  rarity="LEGEND";
 }else if(r<10){
  rarity="EPIC";
 }else if(r<30){
  rarity="RARE";
 }else{
  rarity="NORMAL";
 }

 const pool=loot[rarity];

 const item={
  ...pool[rand(0,pool.length-1)],
  rarity:rarity
 };

 currentDrop=item;

 showDrop(item);
}

function showDrop(item){

 const overlay=document.getElementById("dropOverlay");
 const card=document.getElementById("dropCard");

 card.className="dropCard "+item.rarity;

 document.getElementById("dropRarity").textContent=item.rarity;
 document.getElementById("dropIcon").textContent=item.icon;
 document.getElementById("dropName").textContent=item.name;
 document.getElementById("dropEffect").textContent=
 "攻撃力 +"+item.atk;

 const chance={
  NORMAL:"70%",
  RARE:"20%",
  EPIC:"8%",
  LEGEND:"1.9%",
  GOD:"0.1%"
 };

 document.getElementById("dropChance").textContent=
 "出現率 "+chance[item.rarity];

 const rarityColors={
  NORMAL:"#d8dce8",
  RARE:"#45a7ff",
  EPIC:"#c367ff",
  LEGEND:"#ffd83d",
  GOD:"#ff66e8"
 };

 document.getElementById("dropRarity").style.color=
 rarityColors[item.rarity];

 if(item.rarity==="LEGEND" || item.rarity==="GOD"){

  document.getElementById("flash").classList.add("go");

  setTimeout(()=>{
   document.getElementById("flash").classList.remove("go");
  },550);
 }

 if(item.rarity==="GOD"){
  vibrate([100,60,100,60,200]);
 }

 overlay.classList.add("show");
}

function closeDrop(equip){

 inventory.push(currentDrop);

 if(equip){
  weapon=currentDrop;
 }

 setBest(currentDrop.rarity);

 document.getElementById("dropOverlay").classList.remove("show");

 stage++;

 if(stage>=enemies.length){
  stage=0;
 }

 enemyHp=enemies[stage].hp;

 currentDrop=null;

 update();
 saveGame();

 document.getElementById("message").innerHTML=
 equip
 ? "✨ 新しい装備を装着！<br>次の敵が現れた！"
 : "🎒 アイテムを保管しました。<br>次の敵へ！";

 busy=false;
 document.getElementById("attackBtn").disabled=false;
}

function rarityRank(r){

 return {
  NORMAL:1,
  RARE:2,
  EPIC:3,
  LEGEND:4,
  GOD:5
 }[r] || 0;
}

let bestRarity="";

function setBest(r){

 if(rarityRank(r)>rarityRank(bestRarity)){

  bestRarity=r;

  document.getElementById("best").textContent=r;
 }
}

function renderInventory(){

 const el=document.getElementById("inventory");

 if(inventory.length===0){

  el.innerHTML=
  '<div style="grid-column:1/3;text-align:center;color:#717b9e;padding:20px;">まだアイテムを持っていません</div>';

  return;
 }

 el.innerHTML="";

 inventory.slice().reverse().slice(0,12).forEach(item=>{

  const div=document.createElement("div");

  div.className="item "+item.rarity;

  div.innerHTML=
   item.icon+" "+item.rarity+
   "<strong>"+item.name+"</strong>"+
   "攻撃力 +"+item.atk;

  el.appendChild(div);
 });
}

function saveGame(){

 const data={
  kills,
  inventory,
  weapon,
  bestRarity
 };

 localStorage.setItem("onePercentDropSave",JSON.stringify(data));
}

function loadGame(){

 const raw=localStorage.getItem("onePercentDropSave");

 if(!raw)return;

 try{

  const data=JSON.parse(raw);

  kills=data.kills || 0;
  inventory=data.inventory || [];

  if(data.weapon){
   weapon=data.weapon;
  }

  bestRarity=data.bestRarity || "";

  if(bestRarity){
   document.getElementById("best").textContent=bestRarity;
  }

 }catch(e){}
}

loadGame();
update();
/* =========================================
   1% DROP - 脳汁演出強化パック Ver.0.2
========================================= */

let audioCtx = null;

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

function tone(freq, duration, type="sine", volume=0.12, delay=0){
  if(!audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(0.001, audioCtx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    audioCtx.currentTime + delay + 0.01
  );
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioCtx.currentTime + delay + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(audioCtx.currentTime + delay);
  osc.stop(audioCtx.currentTime + delay + duration + 0.05);
}


/* 🎲 ダイス */
function sfxDice(){
  for(let i=0;i<9;i++){
    tone(
      180 + Math.random()*220,
      0.05,
      "square",
      0.035,
      i*0.075
    );
  }

  tone(110,0.12,"square",0.08,0.72);
}


/* ⚔️ 通常攻撃 */
function sfxHit(){
  tone(130,0.09,"sawtooth",0.10);
  tone(75,0.14,"square",0.08,0.03);
}


/* 💢 敵の反撃 */
function sfxEnemyHit(){
  tone(95,0.14,"sawtooth",0.10);

/* 📳 画面揺れ */
function screenShake(power=8,duration=300){

  const game=document.getElementById("game");

  const start=Date.now();

  const timer=setInterval(()=>{

    const elapsed=Date.now()-start;

    if(elapsed>=duration){

      clearInterval(timer);
      game.style.transform="";
      return;

    }

    const x=(Math.random()-.5)*power*2;
    const y=(Math.random()-.5)*power*2;

    game.style.transform=
      `translate(${x}px,${y}px)`;

  },30);
}


/* ✨ フラッシュ */
function bigFlash(color="#fff"){

  const div=document.createElement("div");

  div.style.position="fixed";
  div.style.inset="0";
  div.style.background=color;
  div.style.zIndex="9999";
  div.style.pointerEvents="none";
  div.style.opacity="0.9";
  div.style.transition="opacity .45s";

  document.body.appendChild(div);

  requestAnimationFrame(()=>{

    setTimeout(()=>{

      div.style.opacity="0";

    },40);

  });

  setTimeout(()=>div.remove(),550);
}


/* 🎉 パーティクル */
function spawnParticles(symbol,count=15){

  for(let i=0;i<count;i++){

    const p=document.createElement("div");

    p.textContent=symbol;

    p.style.position="fixed";
    p.style.left="50%";
    p.style.top="45%";
    p.style.fontSize=(18+Math.random()*25)+"px";
    p.style.zIndex="9998";
    p.style.pointerEvents="none";
    p.style.transition=
      "transform 1s cubic-bezier(.1,.8,.2,1), opacity 1s";

    document.body.appendChild(p);

    const x=(Math.random()-.5)*window.innerWidth*.9;
    const y=(Math.random()-.5)*window.innerHeight*.65;

    requestAnimationFrame(()=>{

      p.style.transform=
        `translate(${x}px,${y}px) rotate(${Math.random()*720}deg)`;

      p.style.opacity="0";

    });

    setTimeout(()=>p.remove(),1100);
  }
}

================================ */

const v03OldDefeatEnemy =
defeatEnemy;


defeatEnemy = function(){

  const clearedStage =
  stage + 1;


  if(
    clearedStage <
    enemies.length
  ){

    const nextStage =
    clearedStage + 1;


    if(
      nextStage >
      unlockedStage
    ){

      unlockedStage =
      nextStage;


      localStorage.setItem(
        "onePercentDropUnlockedStage",
        unlockedStage
      );

    }

  }


  v03OldDefeatEnemy();

};


/* ===============================
   closeDropの自動進行を調整
================================ */

const v03CloseDrop =
closeDrop;


closeDrop = function(equip){

  const beforeStage =
  stage;


  v03CloseDrop(equip);


  /*
   元ゲームはDROP後に
   自動で次の敵へ行くので、
   最終STAGEからSTAGE1へ
   勝手に戻らないよう調整
  */

  if(
    beforeStage ===
    enemies.length-1
  ){

    stage =
    beforeStage;

    enemyHp =
    enemies[stage].hp;

    update();

  }


  localStorage.setItem(
    "onePercentDropUnlockedStage",
    unlockedStage
  );

};

/* 同じ装備を1つにまとめる */
function getGroupedInventory(){

  const map = new Map();

  inventory.forEach(item=>{

    const key =
      item.rarity + "|" +
      item.name + "|" +
      item.atk;

    if(!map.has(key)){

      map.set(key,{
        ...item,
        count:1
      });

    }else{

      map.get(key).count++;

    }

  });


  /* レア度が高い順に並べる */
  const rank = {
    GOD:5,
    LEGEND:4,
    EPIC:3,
    RARE:2,
    NORMAL:1
  };


  return [...map.values()].sort((a,b)=>{

    const rarityDiff =
      rank[b.rarity] - rank[a.rarity];

    if(rarityDiff !== 0){
      return rarityDiff;
    }

    return b.atk - a.atk;

  });

}

/* =========================================

========================================= */

let highestReachedStage = Number(
  localStorage.getItem(
    "onePercentDropHighestReachedStage"
  ) || 1
);

/*
  これまで遊んだデータも引き継ぐ
*/
highestReachedStage = Math.max(
  highestReachedStage,
  typeof unlockedStage !== "undefined"
    ? unlockedStage
    : 1,
  stage + 1
);

localStorage.setItem(
  "onePercentDropHighestReachedStage",
  highestReachedStage
);


/* =========================================
   CHECKPOINT判定
   STAGE 5 / 10 / 15 / 20...
========================================= */

function isCheckpointStage(stageNumber){

  return (
    stageNumber >= 5 &&
    stageNumber % 5 === 0
  );

}


function isCheckpointUnlocked(stageNumber){

  return (
    isCheckpointStage(stageNumber) &&
    highestReachedStage >= stageNumber
  );

}


/* =========================================
   STAGE到達記録
========================================= */

function recordStageReached(){

  const stageNumber = stage + 1;

  if(stageNumber > highestReachedStage){

    highestReachedStage =
      stageNumber;

    localStorage.setItem(
      "onePercentDropHighestReachedStage",
      highestReachedStage
    );


    /* CHECKPOINT初到達 */
    if(
      isCheckpointStage(
        stageNumber
      )
    ){

      setTimeout(()=>{

        initAudio();

        bigFlash("#ffd83d");

        screenShake(
          8,
          450
        );

        vibrate([
          80,
          50,
          120
        ]);

        tone(
          330,
          .12,
          "sine",
          .09
        );

        tone(
          550,

          "sine",
          .11,
          .10
        );

        tone(

      },400);

    }

  }

}

/* =========================================
   STAGE SELECTを
   CHECKPOINT方式に変更
========================================= */

renderStageSelect = function(){

  const grid =
    document.getElementById(
      "stageGrid"
    );

  if(!grid) return;


  grid.innerHTML = "";


  enemies.forEach(
    (enemy,index)=>{

      const number =
        index + 1;

      const reached =
        number <=
        highestReachedStage;

      const checkpoint =
        isCheckpointStage(
          number
        );

      const checkpointUnlocked =
        isCheckpointUnlocked(
          number
        );

      const canStart =
        number === 1 ||
        checkpointUnlocked;


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "stageChoice" +
        (
          index === stage
          ? " current"
          : ""
        ) +
        (
          !reached
          ? " locked"
          : ""
        );


      let statusText = "";


      if(!reached){

        statusText =
          "🔒 未到達";

      }

      else if(
        number === 1
      ){

        statusText =
          "▶ START";

      }

      else if(
        checkpointUnlocked
      ){

        statusText =
          "🔥 CHECKPOINT";

      }

      else{

        statusText =
          "✓ 到達済み";

      }


      button.innerHTML = `

        <div
          class="stageNumber"
        >
          STAGE ${number}
        </div>


        <div
          class="stageEnemy"
        >
          ${
            reached
            ? enemy.emoji
            : "❔"
          }
        </div>


        <div
          class="stageEnemyName"
        >
          ${
            reached
            ? enemy.name
            : "？？？"
          }
        </div>


        <div
          class="stageStatus"
        >
          ${statusText}
        </div>

      `;


      /*
        開始できるのは

        STAGE 1
        または
        解放済みCHECKPOINTだけ
      */
      if(canStart){

        button.onclick = ()=>{

          startFromCheckpoint(
            index
          );

        };

      }


      grid.appendChild(
        button
      );

    }
  );

};


/* =========================================
   START / CHECKPOINTから開始
========================================= */

function startFromCheckpoint(
  stageIndex
){

  const stageNumber =
    stageIndex + 1;


  /*
    不正なSTAGEからは開始不可
  */
  if(
    stageNumber !== 1 &&
    !isCheckpointUnlocked(
      stageNumber
    )
  ){

    return;

  }


  stage =
    stageIndex;


  enemyHp =
    enemies[stage].hp;


  /*
    チェックポイント再開時は
    HP全回復
  */
  playerHp =
    playerMaxHp;


  update();

  saveGame();


  closeStageSelect();


  initAudio();


  tone(
    330,
    .08,
    "sine",
    .07
  );

  tone(
    600,
    .15,
    "sine",
    .09,
    .08
  );


  if(
    stageNumber === 1
  ){

    document.getElementById(
      "message"
    ).innerHTML =

    "⚔️ <b>STAGE 1</b><br>"
    +"最初から挑戦！";

  }

  else{

    bigFlash(
      "#ffd83d"
    );

    vibrate([
      40,
      35,
      70
    ]);


    document.getElementById(
      "message"
    ).innerHTML =

    "🔥 <b>CHECKPOINT</b><br>"
    +"STAGE "
    +stageNumber+
    " から再開！";

  }

}

function updateDangerSystem(){

  const enemy =
    enemies[stage];

  if(!enemy) return;


  const minDamage =
    enemy.min;

  const maxDamage =
    enemy.max;


  const value =
    document.getElementById(
      "nextDamageValue"
    );

  const text =
    document.getElementById(
      "dangerText"
    );

  const panel =
    document.getElementById(
      "nextDamagePanel"
    );


  if(!value || !text || !panel){
    return;
  }


  value.textContent =
    minDamage+
    " 〜 "+
    maxDamage;


  panel.classList.remove(
    "danger",
    "death"
  );

  document.body.classList.remove(
    "dangerMode",
    "deathMode"
  );


  /* =========================
     確定死亡
     HP <= 最小ダメージ
  ========================= */

  if(
    playerHp <= minDamage &&
    playerHp > 0
  ){

    panel.classList.add(
      "death"
    );

    document.body.classList.add(
      "deathMode"
    );


    value.style.color =
      "#ff5169";


    text.innerHTML =
      "☠️ NEXT HIT = DEATH";


    text.style.color =
      "#ff2945";


    return;
  }


  /* =========================
     死亡可能性あり
     HP <= 最大ダメージ
  ========================= */

  if(
    playerHp <= maxDamage &&
    playerHp > 0
  ){

    panel.classList.add(
      "danger"
    );

    document.body.classList.add(
      "dangerMode"
    );


    value.style.color =
      "#ff7a8b";


    text.innerHTML =
      "⚠️ DANGER";


    text.style.color =
      "#ff5268";


    return;
  }


  /* =========================
     安全圏
  ========================= */

  value.style.color =
    "#ffffff";

  text.innerHTML =
    "SAFE";

  text.style.color =
    "#68e5b0";

}

/* =========================================
   武器の進化段階
========================================= */

function getStars(item){

  return Number(item.stars || 0);

}


function getBaseName(item){

  return item.baseName || item.name;

}


/* =========================================
   同一装備判定
========================================= */

function sameSynthesisItem(a,b){

  return (
    getBaseName(a) === getBaseName(b) &&
    a.rarity === b.rarity &&
    getStars(a) === getStars(b)
  );

}


/* =========================================
   ★1 攻撃力
========================================= */

function makeStar1Atk(item){

  const base = Number(item.atk || 0);

  return Math.max(
    base + 4,
    Math.ceil(base * 1.35)
  );

}


/* =========================================
   ★2 攻撃力

   NORMALでも100個集めれば
   EPIC級まで成長
========================================= */

function makeStar2Atk(item){

  const original =
    Number(
      item.originalAtk ||
      item.atk ||
      0
    );


  switch(item.rarity){

    case "NORMAL":

      return Math.max(
        18,
        Math.ceil(original * 5)
      );


    case "RARE":

      return Math.max(
        30,
        Math.ceil(original * 4)
      );


    case "EPIC":

      return Math.max(
        48,
        Math.ceil(original * 3.5)
      );


    case "LEGEND":

      return Math.max(
        75,
        Math.ceil(original * 3)
      );


    case "GOD":

      return Math.max(
        120,
        Math.ceil(original * 2.2)
      );


    default:

      return Math.max(
        18,
        original * 5
      );
  }

}


/* =========================================
   ★2 覚醒能力

   元レア度によって能力が変化
========================================= */

function getAwakeningAbility(item){

  switch(item.rarity){

    case "NORMAL":

      return {
        type:"sixBonus",
        name:"六閃",
        text:"🎲 6が出るたび追加ダメージ +8"
      };


    case "RARE":

      return {
        type:"pairBonus",
        name:"共鳴",
        text:"🎲 ゾロ目成立で追加ダメージ +15"
      };


    case "EPIC":

      return {
        type:"oneConvert",
        name:"運命改変",
        text:"🎲 出目1を1個だけ6へ変換"
      };


    case "LEGEND":

      return {
        type:"criticalBoost",
        name:"覇王",
        text:"⚡ 6ゾロクリティカル時 追加 +30"
      };


    case "GOD":

      return {
        type:"godPower",
        name:"神域",
        text:"🌈 毎攻撃 ダイス合計の50%を追加"
      };


    default:

      return {
        type:"sixBonus",
        name:"六閃",
        text:"🎲 6が出るたび追加ダメージ +8"
      };
  }

}


/* =========================================
   図鑑グループ処理を更新

   無印 / ★1 / ★2 は別扱い
========================================= */

getGroupedInventory = function(){

  const map =
    new Map();


  inventory.forEach(item=>{

    const stars =
      getStars(item);


    const key =
      item.rarity + "|" +
      getBaseName(item) + "|" +
      stars;


    if(!map.has(key)){

      map.set(
        key,
        {
          ...item,
          count:1
        }
      );

    }else{

      map.get(key).count++;

    }

  });


  const rank = {

    GOD:5,
    LEGEND:4,
    EPIC:3,
    RARE:2,
    NORMAL:1

  };


  return [...map.values()]
  .sort((a,b)=>{

    /*
      ★2を最優先
    */

    const starDiff =
      getStars(b) -
      getStars(a);

    if(starDiff !== 0){

      return starDiff;

    }


    const rarityDiff =
      rank[b.rarity] -
      rank[a.rarity];


    if(rarityDiff !== 0){

      return rarityDiff;

    }


    return b.atk - a.atk;

  });

};


/* =========================================
   ★表示
========================================= */

function starLabel(item){

  const stars =
    getStars(item);


  if(stars === 0){

    return "";

  }


  if(stars === 1){

    return " ★";

  }


  return " ★★";

}


/* =========================================
   合成可能数
========================================= */

function synthesisCount(item){

  return inventory.filter(x=>

    sameSynthesisItem(
      x,
      item
    )

  ).length;

}


/* =========================================
   合成開始
========================================= */

function synthesizeItem(item){

  const stars =
    getStars(item);


  if(stars >= 2){

    return;

  }


  const count =
    synthesisCount(item);


  if(count < 10){

    return;

  }


  /*
    現在装備している武器か
  */

  const wasEquipped =

    getBaseName(weapon) ===
    getBaseName(item) &&

    getStars(weapon) ===
    stars;


  /*
    同じ武器を10個消費
  */

  let removed = 0;


  inventory =
    inventory.filter(x=>{

      if(
        removed < 10 &&
        sameSynthesisItem(
          x,
          item
        )
      ){

        removed++;

        return false;

      }


      return true;

    });


  /*
    進化武器生成
  */

  let evolved;


  /* ==========================
     無印 → ★1
  ========================== */

  if(stars === 0){

    evolved = {

      ...item,

      baseName:
        getBaseName(item),

      originalAtk:
        Number(
          item.originalAtk ||
          item.atk
        ),

      stars:1,

      atk:
        makeStar1Atk(item)

    };


    delete evolved.count;


    inventory.push(
      evolved
    );


    if(wasEquipped){

      weapon =
        evolved;

    }


    saveGame();


    showLimitBreak(
      evolved
    );

  }


  /* ==========================
     ★1 → ★2
  ========================== */

  else{

    const ability =
      getAwakeningAbility(item);


    evolved = {

      ...item,

      baseName:
        getBaseName(item),

      stars:2,

      awakened:true,

      atk:
        makeStar2Atk(item),

      awakeningType:
        ability.type,

      awakeningName:
        ability.name,

      awakeningText:
        ability.text

    };


    delete evolved.count;


    inventory.push(
      evolved
    );


    if(wasEquipped){

      weapon =
        evolved;

    }


    saveGame();


    showAwakening(
      evolved
    );

  }


  update();

}

      >


        <button
          class="
            equipButton
            ${
              isEquipped
              ? "equipped"
              : ""
            }
          "
        >

          ${
            isEquipped
            ? "EQUIPPED"
            : "装備"
          }

        </button>


        ${
          stars < 2

          ? `

            <button

              class="synthesisButton"

              style="
                border:0;
                border-radius:10px;
                padding:9px 7px;

                ${
                  count >= 10

                  ? `
                    background:#ffe04c;
                    color:#171100;
                  `

                  : `
                    background:#242b43;
                    color:#747e9d;
                  `
                }

                font-size:10px;
                font-weight:1000;
              "
            >

              ${
                count >= 10

                ? (
                  stars === 0
                  ? "🔥 合成可能"
                  : "✨ 覚醒可能"
                )

                : count + " / 10"
              }

            </button>

          `

          : `

            <div
              style="
                padding:7px;
                text-align:center;
                color:#d76cff;
                font-size:10px;
                font-weight:1000;
              "
            >
              ★★ MAX
            </div>

          `
        }


      </div>

    `;


    /*
      装備ボタン
    */

    const equipButton =
      card.querySelector(
        ".equipButton"
      );


    if(!isEquipped){

      equipButton.onclick =
        ()=>{

          equipFromInventory(
            item
          );

        };

    }


    /*
      合成ボタン
    */

    const synthesisButton =
      card.querySelector(
        ".synthesisButton"
      );


    if(
      synthesisButton &&
      count >= 10
    ){

      synthesisButton.onclick =
        ()=>{

          synthesizeItem(
            item
          );

        };

    }


    list.appendChild(
      card
    );

  });

};


/* =========================================
   ★2 覚醒能力を戦闘へ接続
========================================= */

const awakeningOldResolveAttack =
  resolveAttack;


resolveAttack = function(rolls){

  /*
    ★2以外は普通に処理
  */

  if(
    !weapon ||
    getStars(weapon) < 2 ||
    !weapon.awakeningType
  ){

    awakeningOldResolveAttack(
      rolls
    );

    return;

  }


  let newRolls =
    [...rolls];


  let bonus =
    0;


  /* =========================
     NORMAL覚醒
     6 × +8
  ========================= */

  if(
    weapon.awakeningType ===
    "sixBonus"
  ){

    const sixes =
      newRolls.filter(
        x=>x===6
      ).length;


    bonus =
      sixes * 8;

  }


  /* =========================
     RARE覚醒
     ゾロ目 +15
  ========================= */

  else if(
    weapon.awakeningType ===
    "pairBonus"
  ){

    const counts =
      {};


    newRolls.forEach(x=>{

      counts[x] =
        (counts[x] || 0) + 1;

    });


    const hasPair =
      Object.values(counts)
      .some(x=>x>=2);


    if(hasPair){

      bonus = 15;

    }

  }


  /* =========================
     EPIC覚醒
     1を1個だけ6へ
  ========================= */

  else if(
    weapon.awakeningType ===
    "oneConvert"
  ){

    const index =
      newRolls.indexOf(1);


    if(index !== -1){

      newRolls[index] =
        6;


      bigFlash(
        "#b95cff"
      );


      tone(
        780,
        .14,
        "sine",
        .10
      );

    }

  }


  /* =========================
     LEGEND覚醒
     クリティカル +30
  ========================= */

  else if(
    weapon.awakeningType ===
    "criticalBoost"
  ){

    const sixes =
      newRolls.filter(
        x=>x===6
      ).length;


    if(sixes >= 2){

      bonus = 30;

    }

  }


  /* =========================
     GOD覚醒
     ダイス合計の50%
  ========================= */

  else if(
    weapon.awakeningType ===
    "godPower"
  ){

    const total =
      newRolls.reduce(
        (a,b)=>a+b,
        0
      );


    bonus =
      Math.ceil(
        total * .5
      );

  }


  /*
    bonusを一時的に
    武器攻撃力へ加算
  */

  const originalAtk =
    weapon.atk;


  weapon.atk +=
    bonus;


  if(bonus > 0){

    spawnParticles(
      "✨",
      8
    );


    vibrate(
      50
    );

  }


  awakeningOldResolveAttack(
    newRolls
  );


  /*
    次ターンには戻す
  */

  weapon.atk =
    originalAtk;

};

function loadArmorData(){

    const data =
      JSON.parse(raw);


    if(data){

/* =========================================
   ARMOR表示更新
========================================= */

function updateArmorDisplay(){

  const armorText =
    document.getElementById(
      "armorText"
    );


  if(!armorText){

    return;

  }


  const a =
    window.armor;


  if(
    !a ||
    a.name === "なし"
  ){

    armorText.textContent =
      "なし";

    armorText.style.color =
      "#8892ad";

    return;

  }


  /*
    将来、
    防御値や%軽減を表示できる
  */

  let effectText = "";


  if(
    Number(a.defense || 0) > 0
  ){

    effectText =
      " DEF +"+
      a.defense;

  }


  if(
    Number(a.reduction || 0) > 0
  ){

    effectText =
      " -"+
      a.reduction+
      "%";

  }


  armorText.textContent =
    (a.icon || "🛡️")+
    " "+
    a.name+
    effectText;


  /*
    レア度別表示色
  */

  const colors = {

    NORMAL:"#c4cadb",
    RARE:"#49aaff",
    EPIC:"#c568ff",
    LEGEND:"#ffd83d",
    GOD:"#ff6ce8"

  };


  armorText.style.color =
    colors[a.rarity] ||
    "#ffffff";

}

update = function(){
